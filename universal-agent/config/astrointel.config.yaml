    - "Confidence levels: HIGH = 3+ domains agree, MEDIUM = 2 domains agree, LOW = 1 domain."
    - "G1 = Rate Limit Guard, G2 = Prompt Injection Detector, G3 = PII Filter, G4 = Faithfulness Gate, G5 = Output Validator."
    - "Report styles: Laser Sharp (precise), Detailed (comprehensive), Poetic (narrative)."
    - "Intake form collects: Name, Date of Birth, Place of Birth, Question, and selected analysis modules."
    - "Admin Review step: Admins can approve, edit, or reject each insight before it reaches the user."
    - "Remedies section: daily habits, mantras, lucky colors, gemstones, fasting days, Vastu corrections."
    - "Supported roles: USER, ADMIN, SUPERADMIN — JWT Bearer + X-API-Key dual authentication."
