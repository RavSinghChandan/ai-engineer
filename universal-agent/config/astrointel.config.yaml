# ── Server ────────────────────────────────────────────────────
server:
  host: "0.0.0.0"
  port: 8010
  cors_origins:
    - "http://localhost:4200"
    - "http://localhost:4201"
    - "http://localhost:4202"
    - "http://localhost:4203"
    - "http://localhost:4300"
    - "http://127.0.0.1:4200"
  rate_limit:
    enabled: false
    requests_per_minute: 60

# ── Widget ────────────────────────────────────────────────────
widget:
  theme:
    primary_color: "#7c3aed"
    background_color: "#0f0a1e"
    text_color: "#e2d9f3"
    border_radius: "14px"
  position: "bottom-right"
  trigger_text: "Ask Jyoti"
  placeholder_text: "Ask about your reading…"
  show_branding: false

# ── Voice ─────────────────────────────────────────────────────
voice:
  enabled: true
  stt_provider: "browser"
  tts_provider: "browser"
  language: "en-IN"
  speak_responses: true
  tts_rate: 0.78        # slow, meditative — spiritual guide pace
  tts_pitch: 1.20       # soft feminine, not sharp
  tts_volume: 0.88      # gentle, not loud
  strip_emojis: true    # never read "cherry blossom" or icon names

# ── Logging ───────────────────────────────────────────────────
logging:
  level: "INFO"
  log_to_file: false
