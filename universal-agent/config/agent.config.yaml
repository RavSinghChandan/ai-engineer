# ============================================================
# UNIVERSAL AGENT — Active Config
# Stack: FastAPI + DeepSeek + Angular
# ============================================================

agent:
  name: "Aarav"
  mode: "react"
  persona: |
    You are Aarav, a senior AI assistant.
    You help users with their questions clearly and concisely.
    You are honest, direct, and professional.
    You know about the application you are embedded in and can help users navigate it.
  language: "en"
  fallback_message: "I'm not sure about that — could you rephrase or give me more context?"

# --- LLM: DeepSeek (OpenAI-compatible, 500x cheaper than GPT-4o) ---
llm:
  provider: "deepseek"
  model: "deepseek-chat"
  temperature: 0.7
  max_tokens: 1024
  api_key_env: "DEEPSEEK_API_KEY"

# --- Memory ---
memory:
  backend: "in_process"
  max_history: 20
  session_ttl_seconds: 3600

# --- Knowledge Base (disabled — enable when you have docs to add) ---
knowledge_base:
  enabled: false
  type: "faiss"
  source_dir: "./knowledge"
  embedding_provider: "openai"
  embedding_model: "text-embedding-3-small"
  chunk_size: 500
  chunk_overlap: 50
  top_k: 3

# --- Tools ---
tools:
  calculator:
    enabled: true
  datetime:
    enabled: true
  web_search:
    enabled: false
    provider: "tavily"
    api_key_env: "TAVILY_API_KEY"
  custom_tools:
    enabled: false
    module_path: "./tools/custom_tools.py"

# --- Context: what the agent knows about your app ---
context:
  app_name: "My Application"
  app_description: "An AI-powered application. Ask me anything about it."
  extra_facts:
    - "Built with FastAPI backend and Angular frontend."
    - "Powered by DeepSeek AI."

# --- Server ---
server:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:4200"
    - "http://localhost:4300"
    - "http://127.0.0.1:4200"
  rate_limit:
    enabled: false
    requests_per_minute: 60

# --- Widget ---
widget:
  theme:
    primary_color: "#6366f1"
    background_color: "#ffffff"
    text_color: "#1f2937"
    border_radius: "12px"
  position: "bottom-right"
  trigger_text: "Ask Aarav"
  placeholder_text: "Ask me anything..."
  show_branding: false

# --- Logging ---
logging:
  level: "INFO"
  log_to_file: false
  log_file: "./logs/agent.log"
