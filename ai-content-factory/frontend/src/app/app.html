@if (auth.isAuthenticated()) {
  <header class="sticky top-0 z-10 border-b border-slate-800 bg-slate-950/80 backdrop-blur">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
      <a routerLink="/" class="text-lg font-black tracking-tight text-sky-400">
        AI Content Factory
      </a>
      <nav class="flex items-center gap-1 text-sm">
        <a
          routerLink="/"
          routerLinkActive="text-sky-400"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-lg px-3 py-1.5 text-slate-300 transition hover:text-sky-400"
          >Projects</a
        >
        <a
          routerLink="/prompts"
          routerLinkActive="text-sky-400"
          class="rounded-lg px-3 py-1.5 text-slate-300 transition hover:text-sky-400"
          >Prompts</a
        >
        <a
          routerLink="/profiles"
          routerLinkActive="text-sky-400"
          class="rounded-lg px-3 py-1.5 text-slate-300 transition hover:text-sky-400"
          >Profiles</a
        >
        <span class="mx-2 hidden text-slate-600 sm:inline">·</span>
        <span class="hidden text-slate-400 sm:inline">{{ auth.user()?.full_name }}</span>
        <button class="btn-ghost ml-3 !px-3 !py-1.5" (click)="auth.logout()">Sign out</button>
      </nav>
    </div>
  </header>
}

<main class="px-4 py-8">
  <router-outlet />
</main>
