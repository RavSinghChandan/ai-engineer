<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- Cartoon Chandan — wow/amazed, mouth open, eyes wide -->
  <!-- Body / blazer -->
  <rect x="30" y="88" width="60" height="52" rx="8" fill="#2d4a7a"/>
  <polygon points="52,88 60,103 68,88" fill="#a8c4e0"/>
  <!-- Both arms slightly raised in amazement -->
  <rect x="12" y="88" width="24" height="11" rx="5" fill="#2d4a7a" transform="rotate(-25 24 94)"/>
  <rect x="84" y="88" width="24" height="11" rx="5" fill="#2d4a7a" transform="rotate(25 96 94)"/>
  <!-- Hands -->
  <ellipse cx="10" cy="82" rx="6" ry="6" fill="#c8956c"/>
  <ellipse cx="110" cy="82" rx="6" ry="6" fill="#c8956c"/>
  <!-- Impact stars -->
  <text x="2" y="40" font-size="16" fill="#f59e0b">✦</text>
  <text x="100" y="38" font-size="14" fill="#06b6d4">★</text>
  <text x="5" y="25" font-size="10" fill="#7c3aed">⚡</text>
  <text x="102" y="22" font-size="10" fill="#10b981">⚡</text>
  <!-- Neck -->
  <rect x="52" y="75" width="16" height="16" rx="4" fill="#c8956c"/>
  <!-- Head -->
  <ellipse cx="60" cy="55" rx="28" ry="30" fill="#c8956c"/>
  <!-- Hair -->
  <ellipse cx="60" cy="32" rx="28" ry="16" fill="#1a1a2e"/>
  <ellipse cx="40" cy="37" rx="11" ry="8" fill="#1a1a2e"/>
  <ellipse cx="80" cy="37" rx="11" ry="8" fill="#1a1a2e"/>
  <!-- Ears -->
  <ellipse cx="32" cy="55" rx="5" ry="7" fill="#c8956c"/>
  <ellipse cx="88" cy="55" rx="5" ry="7" fill="#c8956c"/>
  <!-- Glasses -->
  <rect x="37" y="48" width="19" height="13" rx="4" fill="none" stroke="#8b7355" stroke-width="1.5"/>
  <rect x="64" y="48" width="19" height="13" rx="4" fill="none" stroke="#8b7355" stroke-width="1.5"/>
  <line x1="56" y1="54" x2="64" y2="54" stroke="#8b7355" stroke-width="1.5"/>
  <!-- Wide amazed eyes -->
  <circle cx="46.5" cy="55" r="5" fill="white"/>
  <circle cx="73.5" cy="55" r="5" fill="white"/>
  <circle cx="47" cy="55" r="3.5" fill="#2c1810"/>
  <circle cx="74" cy="55" r="3.5" fill="#2c1810"/>
  <circle cx="48" cy="54" r="1.2" fill="white"/>
  <circle cx="75" cy="54" r="1.2" fill="white"/>
  <!-- Eyebrows high up -->
  <path d="M38 44 Q46.5 40 55 44" stroke="#1a1a2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M65 44 Q73.5 40 82 44" stroke="#1a1a2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Beard -->
  <path d="M38 65 Q60 78 82 65 Q82 72 60 78 Q38 72 38 65 Z" fill="#2c2c3e" opacity="0.7"/>
  <!-- Open mouth wow -->
  <ellipse cx="60" cy="72" rx="8" ry="6" fill="#8b4513"/>
  <ellipse cx="60" cy="70" rx="7" ry="3" fill="white"/>
  <!-- Nose -->
  <path d="M57 60 Q55 66 60 67 Q65 66 63 60" stroke="#b07050" stroke-width="1" fill="none"/>
</svg>