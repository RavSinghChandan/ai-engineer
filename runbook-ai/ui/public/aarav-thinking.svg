<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- THINKING: SAME saffron robes, hand on chin, birth chart in other hand -->
  <rect x="28" y="90" width="64" height="55" rx="10" fill="#e07b2a"/>
  <polygon points="50,90 60,106 70,90" fill="#f5a623"/>
  <line x1="50" y1="90" x2="44" y2="145" stroke="#c96a18" stroke-width="1.2" opacity="0.4"/>
  <line x1="70" y1="90" x2="76" y2="145" stroke="#c96a18" stroke-width="1.2" opacity="0.4"/>
  <!-- Left arm — hand on chin -->
  <rect x="14" y="90" width="22" height="11" rx="5" fill="#e07b2a" transform="rotate(12 25 95)"/>
  <ellipse cx="19" cy="78" rx="7" ry="7" fill="#c8956c"/>
  <!-- Right arm — holding birth chart -->
  <rect x="84" y="92" width="22" height="11" rx="5" fill="#e07b2a" transform="rotate(-8 95 97)"/>
  <ellipse cx="109" cy="100" rx="6" ry="6" fill="#c8956c"/>
  <!-- Birth chart wheel -->
  <circle cx="109" cy="114" r="11" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="109" cy="114" r="5"  fill="none" stroke="#f59e0b" stroke-width="1"/>
  <line x1="109" y1="103" x2="109" y2="125" stroke="#a78bfa" stroke-width="0.8" opacity="0.6"/>
  <line x1="98"  y1="114" x2="120" y2="114" stroke="#a78bfa" stroke-width="0.8" opacity="0.6"/>
  <text x="104" y="112" font-size="5" fill="#f59e0b">♈</text>
  <text x="104" y="120" font-size="5" fill="#a78bfa">♎</text>
  <!-- Thought bubbles -->
  <circle cx="24" cy="66" r="2"   fill="#a78bfa" opacity="0.5"/>
  <circle cx="17" cy="57" r="3"   fill="#a78bfa" opacity="0.4"/>
  <circle cx="9"  cy="46" r="4.5" fill="#a78bfa" opacity="0.25"/>
  <text x="95" y="55" font-size="9" fill="#f59e0b" opacity="0.6">✦</text>
  <!-- Neck -->
  <rect x="51" y="77" width="18" height="16" rx="4" fill="#c8956c"/>
  <!-- Head -->
  <ellipse cx="60" cy="57" rx="26" ry="28" fill="#c8956c"/>
  <ellipse cx="60" cy="34" rx="26" ry="14" fill="#1a0a00"/>
  <ellipse cx="38" cy="40" rx="10" ry="9"  fill="#1a0a00"/>
  <ellipse cx="82" cy="40" rx="10" ry="9"  fill="#1a0a00"/>
  <ellipse cx="60" cy="23" rx="9"  ry="7"  fill="#1a0a00"/>
  <ellipse cx="34" cy="57" rx="5" ry="6" fill="#c8956c"/>
  <ellipse cx="86" cy="57" rx="5" ry="6" fill="#c8956c"/>
  <circle cx="34" cy="61" r="2.5" fill="#f5a623" stroke="#c96a18" stroke-width="0.5"/>
  <circle cx="86" cy="61" r="2.5" fill="#f5a623" stroke="#c96a18" stroke-width="0.5"/>
  <ellipse cx="60" cy="40" rx="2.5" ry="5" fill="#e74c3c"/>
  <ellipse cx="60" cy="38" rx="1"   ry="2" fill="#fff" opacity="0.7"/>
  <!-- Eyes — narrowed in thought -->
  <path d="M43 54 Q48 51 53 54" stroke="#3d1c02" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M67 54 Q72 51 77 54" stroke="#3d1c02" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M42 47 Q48 44 54 48" stroke="#1a0a00" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M66 48 Q72 44 78 47" stroke="#1a0a00" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M57 61 Q55 67 60 68 Q65 67 63 61" stroke="#a0704a" stroke-width="1" fill="none"/>
  <path d="M51 71 Q60 75 69 71" stroke="#8b4513" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M40 92 Q60 100 80 92" stroke="#6b3a1f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="3 2"/>
</svg>
