name: Promote — staging → main (Production Release)

# This is the ONLY way code reaches production.
# A human must trigger this manually after verifying staging is healthy.
# It merges staging into main, which triggers build-push → deploy on main.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "8-char SHA tag verified on staging (e.g. 15ec7f3). Leave blank to use 'staging' tag."
        required: false
        default: ""
      release_notes:
        description: "One-line description of what this release contains"
        required: true

jobs:
  promote:
    name: Promote staging → main
    runs-on: ubuntu-latest

    # Requires a GitHub Environment named "production" with required reviewers configured.
    # Nobody can click "approve" except designated production approvers.
    environment:
      name: production

    permissions:
      contents: write    # needed to push the merge commit to main
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for merge

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Verify staging ECS health before merging — fail-fast if staging is sick
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify staging API is healthy
        run: |
          STATUS=$(aws ecs describe-services \
            --cluster astrointel-staging-cluster \
            --services astrointel-api-staging \
            --query 'services[0].deployments[0].rolloutState' \
            --output text 2>/dev/null || echo "UNKNOWN")
          echo "Staging rollout state: $STATUS"
          if [ "$STATUS" != "COMPLETED" ] && [ "$STATUS" != "UNKNOWN" ]; then
            echo "❌ Staging is not stable (state=$STATUS). Aborting promotion."
            exit 1
          fi
          echo "✅ Staging is stable — proceeding with promotion."

      # Merge staging into main — this triggers build-push.yml on main
      - name: Merge staging → main
        run: |
          git checkout main
          git pull origin main
          git merge origin/staging \
            --no-ff \
            -m "release: promote staging → main

Release notes: ${{ github.event.inputs.release_notes }}
Image tag verified on staging: ${{ github.event.inputs.image_tag || 'staging' }}
Triggered by: ${{ github.actor }}
"
          git push origin main
          echo "✅ staging merged to main — build-push + deploy will trigger automatically."

      # Keep develop in sync with main after promotion
      - name: Sync develop with main
        run: |
          git checkout develop
          git pull origin develop
          git merge origin/main --no-ff -m "chore: sync develop with main after production release"
          git push origin develop
          echo "✅ develop synced with main."

      - name: Promotion complete
        run: |
          echo "🚀 Promotion complete."
          echo "   build-push.yml is now running on main."
          echo "   deploy.yml will trigger once images are pushed."
          echo "   Release: ${{ github.event.inputs.release_notes }}"
