name: Build & Push — Docker Images to ECR

# Runs only on merge to main (after CI tests pass)
on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1          # Mumbai — change to your region
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  API_IMAGE: astrointel-api
  WEB_IMAGE: astrointel-web

jobs:

  # ── Gate: run tests before building images ───────────────────────────────────
  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: astrointel_test
          POSTGRES_USER: astrointel
          POSTGRES_PASSWORD: test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astrointel -d astrointel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: astro-intel-backend/requirements.txt
      - run: pip install -r astro-intel-backend/requirements.txt
      - name: Run pytest
        working-directory: astro-intel-backend
        env:
          DATABASE_URL: postgresql://astrointel:test_pw@localhost:5432/astrointel_test
          JWT_SECRET: ci-test-jwt-secret-not-production
          MASTER_API_KEY: sk-master-ci-test-key
          PW_SALT: ci-test-salt
          SUPERADMIN_PASSWORD: CiTest2024!
          APP_ENV: development
          RESEND_API_KEY: re_test_placeholder
        run: pytest tests/ -v --tb=short --no-header

  frontend-build:
    name: Frontend Build (ng build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: astro-intel/package-lock.json
      - working-directory: astro-intel
        run: npm ci --legacy-peer-deps
      - name: Build production bundle
        working-directory: astro-intel
        run: npx ng build --configuration production

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    # GATE: both test jobs must pass before any image is built or pushed
    needs: [backend-test, frontend-build]

    permissions:
      contents: read
      id-token: write   # needed for OIDC auth to AWS

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag (short SHA)
        run: echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV

      # ── Build + push backend ──────────────────────────────────────────────
      - name: Build backend image
        run: |
          docker build \
            -t $ECR_REGISTRY/$API_IMAGE:$IMAGE_TAG \
            -t $ECR_REGISTRY/$API_IMAGE:latest \
            ./astro-intel-backend

      - name: Push backend image
        run: |
          docker push $ECR_REGISTRY/$API_IMAGE:$IMAGE_TAG
          docker push $ECR_REGISTRY/$API_IMAGE:latest

      # ── Build + push frontend ─────────────────────────────────────────────
      - name: Build frontend image
        run: |
          docker build \
            -t $ECR_REGISTRY/$WEB_IMAGE:$IMAGE_TAG \
            -t $ECR_REGISTRY/$WEB_IMAGE:latest \
            ./astro-intel

      - name: Push frontend image
        run: |
          docker push $ECR_REGISTRY/$WEB_IMAGE:$IMAGE_TAG
          docker push $ECR_REGISTRY/$WEB_IMAGE:latest

      # ── Output image URIs for deploy workflow ─────────────────────────────
      - name: Output image URIs
        run: |
          echo "API image: $ECR_REGISTRY/$API_IMAGE:$IMAGE_TAG"
          echo "Web image: $ECR_REGISTRY/$WEB_IMAGE:$IMAGE_TAG"

      - name: Save image tag for deploy
        run: echo "$IMAGE_TAG" > image-tag.txt

      - uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image-tag.txt
          retention-days: 1
