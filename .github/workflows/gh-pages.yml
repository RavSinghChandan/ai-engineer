name: Deploy UI — GitHub Pages

# Deploys the Angular frontend as a static site to GitHub Pages.
# The backend is NOT deployed — the UI is a live demo shell.
# Live URL: https://ravsinghchandan.github.io/ai-engineer/
on:
  push:
    branches: [main]
    paths:
      - "astro-intel/**"
      - ".github/workflows/gh-pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # ── Job 1: Build ─────────────────────────────────────────────────────────────
  build:
    name: Build Angular
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: astro-intel/package-lock.json

      - name: Install dependencies
        working-directory: astro-intel
        run: npm ci --legacy-peer-deps

      - name: Build production bundle
        working-directory: astro-intel
        run: npx ng build --configuration production --base-href /ai-engineer/

      - name: Add 404.html for SPA router support
        run: cp astro-intel/dist/astro-intel/browser/index.html astro-intel/dist/astro-intel/browser/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: astro-intel/dist/astro-intel/browser

  # ── Job 2: Deploy ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
