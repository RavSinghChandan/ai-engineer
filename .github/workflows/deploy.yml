name: Deploy — ECS Rolling Update

# Triggers after build-push completes on staging or main.
# staging branch → astrointel-staging-cluster
# main branch    → astrointel-cluster (production)
on:
  workflow_run:
    workflows: ["Build & Push — Docker Images to ECR"]
    types: [completed]
    branches: [staging, main]

  # Manual trigger for hotfixes / rollbacks
  workflow_dispatch:
    inputs:
      branch:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, main]
        default: staging
      image_tag:
        description: "Image tag to deploy (8-char SHA or 'staging'/'latest')"
        required: false
        default: latest

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  API_IMAGE: astrointel-api
  WEB_IMAGE: astrointel-web

jobs:
  deploy:
    name: Deploy to ${{ github.event.workflow_run.head_branch || github.event.inputs.branch }}
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Resolve which branch triggered this deploy and set cluster/service/tag accordingly
      - name: Resolve deployment target
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch || github.event.inputs.branch }}"
          TAG="${{ github.event.inputs.image_tag || '' }}"

          if [ "$BRANCH" = "main" ]; then
            echo "ECS_CLUSTER=astrointel-cluster"              >> $GITHUB_ENV
            echo "API_SERVICE=astrointel-api-service"          >> $GITHUB_ENV
            echo "WEB_SERVICE=astrointel-web-service"          >> $GITHUB_ENV
            echo "API_TASK_FAMILY=astrointel-api"              >> $GITHUB_ENV
            echo "WEB_TASK_FAMILY=astrointel-web"              >> $GITHUB_ENV
            echo "IMAGE_TAG=${TAG:-latest}"                    >> $GITHUB_ENV
            echo "DEPLOY_ENV=production"                       >> $GITHUB_ENV
          else
            echo "ECS_CLUSTER=astrointel-staging-cluster"      >> $GITHUB_ENV
            echo "API_SERVICE=astrointel-api-staging"          >> $GITHUB_ENV
            echo "WEB_SERVICE=astrointel-web-staging"          >> $GITHUB_ENV
            echo "API_TASK_FAMILY=astrointel-api-staging"      >> $GITHUB_ENV
            echo "WEB_TASK_FAMILY=astrointel-web-staging"      >> $GITHUB_ENV
            echo "IMAGE_TAG=${TAG:-staging}"                   >> $GITHUB_ENV
            echo "DEPLOY_ENV=staging"                          >> $GITHUB_ENV
          fi

      # ── Deploy backend (API) ──────────────────────────────────────────────
      - name: Get current API task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $API_TASK_FAMILY \
            --query taskDefinition \
            > api-task-def.json

      - name: Update API image in task definition
        id: api-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: api-task-def.json
          container-name: astrointel-api
          image: ${{ env.ECR_REGISTRY }}/${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Deploy API to ECS (${{ env.DEPLOY_ENV }})
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.api-task.outputs.task-definition }}
          service: ${{ env.API_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # ── Deploy frontend (Web) ─────────────────────────────────────────────
      - name: Get current Web task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $WEB_TASK_FAMILY \
            --query taskDefinition \
            > web-task-def.json

      - name: Update Web image in task definition
        id: web-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: web-task-def.json
          container-name: astrointel-web
          image: ${{ env.ECR_REGISTRY }}/${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Deploy Web to ECS (${{ env.DEPLOY_ENV }})
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.web-task.outputs.task-definition }}
          service: ${{ env.WEB_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deployment summary
        run: |
          echo "✅ Deployed $IMAGE_TAG to $DEPLOY_ENV"
          echo "   Cluster  : $ECS_CLUSTER"
          echo "   API image: $ECR_REGISTRY/$API_IMAGE:$IMAGE_TAG"
          echo "   Web image: $ECR_REGISTRY/$WEB_IMAGE:$IMAGE_TAG"
