name: CI — Bench Resource Optimizer

# Runs on every PR and push to main that touches bench-resource-optimizer
on:
  pull_request:
    branches: [main]
    paths:
      - "bench-resource-optimizer/**"
      - ".github/workflows/bench-ci.yml"
  push:
    branches: [main]
    paths:
      - "bench-resource-optimizer/**"
      - ".github/workflows/bench-ci.yml"

jobs:

  # ── Backend: Python tests ────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: bench-resource-optimizer/backend/requirements.txt

      - name: Install dependencies
        working-directory: bench-resource-optimizer/backend
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: bench-resource-optimizer/backend
        env:
          # DEEPSEEK_API_KEY deliberately not set — all LLM calls are mocked in tests
          # SQLite uses tmp_path fixtures — no real DB needed
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest tests/ -v --tb=short --no-header

  # ── Frontend: Angular build check ───────────────────────────────────────────
  frontend-build:
    name: Frontend Build (ng build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bench-resource-optimizer/frontend/package-lock.json

      - name: Install dependencies
        working-directory: bench-resource-optimizer/frontend
        run: npm ci --legacy-peer-deps

      - name: Build production bundle
        working-directory: bench-resource-optimizer/frontend
        run: npx ng build --configuration production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-angular-dist
          path: bench-resource-optimizer/frontend/dist/
          retention-days: 1
