name: Deploy — Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Angular for production
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bench-resource-optimizer/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bench-resource-optimizer/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production, base-href for Pages)
        run: |
          npx ng build \
            --configuration=production \
            --base-href=/ai-engineer/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: bench-resource-optimizer/frontend/dist/browser

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
