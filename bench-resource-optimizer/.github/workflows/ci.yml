name: Backend CI — pytest

on:
  push:
    branches: [main, staging, develop, "feature/**"]
  pull_request:
    branches: [main, staging, develop]

jobs:
  test:
    name: Run pytest (153+ tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bench-resource-optimizer/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: bench-resource-optimizer/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create CI environment file
        run: cp .env.ci .env

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: bench-resource-optimizer/backend/coverage.xml
