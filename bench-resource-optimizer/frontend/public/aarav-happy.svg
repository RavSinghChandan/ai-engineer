<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- HAPPY: saffron robes, arms up celebrating, star in hand -->
  <rect x="28" y="90" width="64" height="55" rx="10" fill="#e07b2a"/>
  <polygon points="50,90 60,108 70,90" fill="#f5a623"/>
  <line x1="50" y1="90" x2="44" y2="145" stroke="#c96a18" stroke-width="1.2" opacity="0.4"/>
  <line x1="70" y1="90" x2="76" y2="145" stroke="#c96a18" stroke-width="1.2" opacity="0.4"/>
  <!-- Arms up -->
  <rect x="10" y="72" width="22" height="11" rx="5" fill="#e07b2a" transform="rotate(-50 21 77)"/>
  <ellipse cx="9" cy="62" rx="7" ry="7" fill="#c8956c"/>
  <rect x="88" y="72" width="22" height="11" rx="5" fill="#e07b2a" transform="rotate(50 99 77)"/>
  <ellipse cx="111" cy="62" rx="7" ry="7" fill="#c8956c"/>
  <text x="105" y="55" font-size="14" fill="#f59e0b">★</text>
  <text x="6"  y="52" font-size="10" fill="#a78bfa">✦</text>
  <text x="96" y="40" font-size="9"  fill="#f59e0b">✨</text>
  <!-- Neck -->
  <rect x="51" y="77" width="18" height="16" rx="4" fill="#c8956c"/>
  <!-- Head -->
  <ellipse cx="60" cy="57" rx="26" ry="28" fill="#c8956c"/>
  <!-- Hair + topknot -->
  <ellipse cx="60" cy="34" rx="26" ry="14" fill="#1a0a00"/>
  <ellipse cx="38" cy="40" rx="10" ry="9"  fill="#1a0a00"/>
  <ellipse cx="82" cy="40" rx="10" ry="9"  fill="#1a0a00"/>
  <ellipse cx="60" cy="23" rx="9"  ry="7"  fill="#1a0a00"/>
  <!-- Ears + gold earrings -->
  <ellipse cx="34" cy="57" rx="5" ry="6" fill="#c8956c"/>
  <ellipse cx="86" cy="57" rx="5" ry="6" fill="#c8956c"/>
  <circle cx="34" cy="61" r="2.5" fill="#f5a623" stroke="#c96a18" stroke-width="0.5"/>
  <circle cx="86" cy="61" r="2.5" fill="#f5a623" stroke="#c96a18" stroke-width="0.5"/>
  <!-- Tilak -->
  <ellipse cx="60" cy="40" rx="2.5" ry="5" fill="#e74c3c"/>
  <ellipse cx="60" cy="38" rx="1"   ry="2" fill="#fff" opacity="0.7"/>
  <!-- Eyes — happy squint -->
  <ellipse cx="48" cy="55" rx="5" ry="5.5" fill="white"/>
  <ellipse cx="72" cy="55" rx="5" ry="5.5" fill="white"/>
  <ellipse cx="49" cy="56" rx="3" ry="3.5" fill="#3d1c02"/>
  <ellipse cx="73" cy="56" rx="3" ry="3.5" fill="#3d1c02"/>
  <circle cx="50" cy="54" r="1" fill="white"/>
  <circle cx="74" cy="54" r="1" fill="white"/>
  <path d="M43 51 Q48 48 53 51" stroke="#1a0a00" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M67 51 Q72 48 77 51" stroke="#1a0a00" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M57 61 Q55 67 60 68 Q65 67 63 61" stroke="#a0704a" stroke-width="1" fill="none"/>
  <!-- Big smile + teeth -->
  <path d="M47 70 Q60 82 73 70" stroke="#8b4513" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M51 72 Q60 80 69 72 Q69 77 60 78 Q51 77 51 72 Z" fill="white" opacity="0.85"/>
  <!-- Rudraksha mala -->
  <path d="M40 92 Q60 100 80 92" stroke="#6b3a1f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="3 2"/>
</svg>
