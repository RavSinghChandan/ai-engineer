  <ellipse cx="86" cy="57" rx="5" ry="6" fill="#c8956c"/>
  <circle cx="34" cy="61" r="2.5" fill="#f5a623" stroke="#c96a18" stroke-width="0.5"/>
  <circle cx="86" cy="61" r="2.5" fill="#f5a623" stroke="#c96a18" stroke-width="0.5"/>
