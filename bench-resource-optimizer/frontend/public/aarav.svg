  <path d="M66 47 Q72 44 78 47" stroke="#1a0a00" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M57 61 Q55 67 60 68 Q65 67 63 61" stroke="#a0704a" stroke-width="1" fill="none"/>
