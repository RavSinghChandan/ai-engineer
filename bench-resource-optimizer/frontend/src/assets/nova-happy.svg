<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- Blue professional suit -->
  <rect x="26" y="88" width="68" height="57" rx="8" fill="#1d4ed8"/>
  <!-- White shirt/blouse under -->
  <polygon points="52,88 60,100 68,88" fill="#ffffff"/>
  <rect x="56" y="88" width="8" height="20" fill="#ffffff" rx="1"/>
  <!-- Suit lapels -->
  <polygon points="52,88 44,105 52,108" fill="#1e3a8a"/>
  <polygon points="68,88 76,105 68,108" fill="#1e3a8a"/>
  <!-- Left arm — relaxed -->
  <rect x="12" y="96" width="18" height="10" rx="5" fill="#1d4ed8" transform="rotate(5 21 101)"/>
  <ellipse cx="9" cy="106" rx="6" ry="6" fill="#c8956c"/>
  <!-- Right arm — holding clipboard -->
  <rect x="90" y="90" width="18" height="10" rx="5" fill="#1d4ed8" transform="rotate(-5 99 95)"/>
  <ellipse cx="109" cy="100" rx="6" ry="6" fill="#c8956c"/>
  <!-- Clipboard -->
  <rect x="103" y="104" width="16" height="21" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="108" y="102" width="6" height="4" rx="1" fill="#64748b"/>
  <line x1="105" y1="110" x2="117" y2="110" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="105" y1="113" x2="117" y2="113" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="105" y1="116" x2="113" y2="116" stroke="#3b82f6" stroke-width="0.8"/>
  <!-- Badge on chest -->
  <rect x="38" y="100" width="14" height="9" rx="2" fill="#3b82f6"/>
  <text x="41" y="107" font-size="5" fill="white" font-weight="bold">HR</text>
  <!-- Sparkles -->
  <text x="92" y="58" font-size="8" fill="#3b82f6" opacity="0.6">✦</text>
  <text x="16" y="82" font-size="7" fill="#60a5fa" opacity="0.5">★</text>
  <!-- Neck -->
  <rect x="52" y="77" width="16" height="14" rx="4" fill="#c8956c"/>
  <!-- Head -->
  <ellipse cx="60" cy="56" rx="24" ry="26" fill="#c8956c"/>
  <!-- Short professional hair — bob cut -->
  <ellipse cx="60" cy="36" rx="24" ry="12" fill="#2c1810"/>
  <ellipse cx="36" cy="46" rx="10" ry="14" fill="#2c1810"/>
  <ellipse cx="84" cy="46" rx="10" ry="14" fill="#2c1810"/>
  <rect x="36" y="46" width="48" height="15" fill="#2c1810"/>
  <!-- Ears + small stud earrings -->
  <ellipse cx="36" cy="56" rx="4" ry="5" fill="#c8956c"/>
  <ellipse cx="84" cy="56" rx="4" ry="5" fill="#c8956c"/>
  <circle cx="36" cy="54" r="2" fill="#3b82f6"/>
  <circle cx="84" cy="54" r="2" fill="#3b82f6"/>
  <!-- Glasses — smart, professional -->
  <rect x="40" y="50" width="15" height="10" rx="3" fill="none" stroke="#475569" stroke-width="1.5"/>
  <rect x="65" y="50" width="15" height="10" rx="3" fill="none" stroke="#475569" stroke-width="1.5"/>
  <line x1="55" y1="55" x2="65" y2="55" stroke="#475569" stroke-width="1.5"/>
  <line x1="37" y1="55" x2="40" y2="55" stroke="#475569" stroke-width="1.2"/>
  <line x1="80" y1="55" x2="84" y2="55" stroke="#475569" stroke-width="1.2"/>
  <!-- Eyes behind glasses -->
  <ellipse cx="47" cy="55" rx="3.5" ry="3.5" fill="#3d1c02"/>
  <ellipse cx="72" cy="55" rx="3.5" ry="3.5" fill="#3d1c02"/>
  <circle cx="48" cy="54" r="1" fill="white"/>
  <circle cx="73" cy="54" r="1" fill="white"/>
  <!-- Eyebrows -->
  <path d="M41 47 Q47 44 53 47" stroke="#2c1810" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M67 47 Q73 44 79 47" stroke="#2c1810" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M57 61 Q55 66 60 67 Q65 66 63 61" stroke="#a0704a" stroke-width="1" fill="none"/>
  <!-- Confident smile -->
  <path d="M49 70 Q60 80 71 70" stroke="#7a4020" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M52 72 Q60 79 68 72 Q68 76 60 77 Q52 76 52 72 Z" fill="white" opacity="0.85"/>
</svg>
