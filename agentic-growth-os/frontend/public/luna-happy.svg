<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- Orange/coral creative outfit -->
  <rect x="26" y="88" width="68" height="57" rx="10" fill="#ea580c"/>
  <!-- White collar -->
  <polygon points="52,88 60,102 68,88" fill="#ffffff"/>
  <!-- Creative badge/lanyard -->
  <line x1="60" y1="88" x2="60" y2="105" stroke="#fed7aa" stroke-width="1.5"/>
  <rect x="55" y="105" width="10" height="7" rx="1" fill="#fff7ed" stroke="#ea580c" stroke-width="0.5"/>
  <text x="57" y="110" font-size="4" fill="#ea580c" font-weight="bold">CMO</text>
  <!-- Geometric pattern on outfit -->
  <polygon points="32,120 40,110 48,120" fill="#c2410c" opacity="0.5"/>
  <polygon points="72,120 80,110 88,120" fill="#c2410c" opacity="0.5"/>
  <!-- Left arm — raised with megaphone -->
  <rect x="6" y="74" width="24" height="11" rx="5" fill="#ea580c" transform="rotate(-45 18 79)"/>
  <ellipse cx="3" cy="62" rx="7" ry="7" fill="#c8956c"/>
  <!-- Megaphone -->
  <polygon points="3,52 3,62 -3,64 -3,50 Z" fill="#f97316"/>
  <polygon points="-3,50 -3,64 -12,68 -12,46 Z" fill="#fed7aa"/>
  <line x1="-12" y1="46" x2="-12" y2="68" stroke="#f97316" stroke-width="1"/>
  <!-- Right arm — raised, pointing up -->
  <rect x="90" y="72" width="24" height="11" rx="5" fill="#ea580c" transform="rotate(45 102 77)"/>
  <ellipse cx="117" cy="62" rx="7" ry="7" fill="#c8956c"/>
  <!-- Pointing finger -->
  <line x1="117" y1="55" x2="117" y2="46" stroke="#c8956c" stroke-width="5" stroke-linecap="round"/>
  <!-- Rocket above finger -->
  <text x="111" y="44" font-size="16">🚀</text>
  <!-- Graph/chart floating -->
  <rect x="88" y="35" width="20" height="14" rx="2" fill="#fff7ed" stroke="#f97316" stroke-width="1"/>
  <line x1="90" y1="45" x2="90" y2="40" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <line x1="94" y1="45" x2="94" y2="37" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <line x1="98" y1="45" x2="98" y2="34" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  <line x1="102" y1="45" x2="102" y2="33" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  <line x1="106" y1="45" x2="106" y2="31" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <!-- Sparkles -->
  <text x="16" y="50" font-size="10" fill="#fbbf24" opacity="0.8">✦</text>
  <text x="94" y="22" font-size="9"  fill="#f97316" opacity="0.7">★</text>
  <text x="20" y="70" font-size="8"  fill="#fbbf24" opacity="0.5">✨</text>
  <!-- Neck -->
  <rect x="52" y="77" width="16" height="14" rx="4" fill="#c8956c"/>
  <!-- Head -->
  <ellipse cx="60" cy="55" rx="24" ry="26" fill="#c8956c"/>
  <!-- Curly/wavy hair — dynamic, creative -->
  <ellipse cx="60" cy="34" rx="24" ry="11" fill="#7c2d12"/>
  <ellipse cx="36" cy="38" rx="11" ry="10" fill="#7c2d12"/>
  <ellipse cx="84" cy="38" rx="11" ry="10" fill="#7c2d12"/>
  <!-- Hair waves/curls -->
  <path d="M34 48 Q30 42 36 38 Q42 34 38 44" fill="#7c2d12"/>
  <path d="M86 48 Q90 42 84 38 Q78 34 82 44" fill="#7c2d12"/>
  <!-- Hair highlight -->
  <path d="M44 32 Q55 27 66 32" stroke="#b45309" stroke-width="2.5" fill="none" opacity="0.5"/>
  <!-- Ears + hoop earrings -->
  <ellipse cx="36" cy="55" rx="4" ry="5" fill="#c8956c"/>
  <ellipse cx="84" cy="55" rx="4" ry="5" fill="#c8956c"/>
  <circle cx="36" cy="58" r="4" fill="none" stroke="#f97316" stroke-width="2"/>
  <circle cx="84" cy="58" r="4" fill="none" stroke="#f97316" stroke-width="2"/>
  <!-- Eyes — bright, energetic -->
  <ellipse cx="48" cy="53" rx="6" ry="6.5" fill="white"/>
  <ellipse cx="72" cy="53" rx="6" ry="6.5" fill="white"/>
  <ellipse cx="49" cy="54" rx="4" ry="4.5" fill="#7c2d12"/>
  <ellipse cx="73" cy="54" rx="4" ry="4.5" fill="#7c2d12"/>
  <circle cx="50" cy="52" r="1.5" fill="white"/>
  <circle cx="74" cy="52" r="1.5" fill="white"/>
  <!-- Eyebrows — raised, expressive -->
  <path d="M41 45 Q48 41 55 45" stroke="#7c2d12" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M65 45 Q72 41 79 45" stroke="#7c2d12" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M57 59 Q55 64 60 65 Q65 64 63 59" stroke="#a0704a" stroke-width="1" fill="none"/>
  <!-- Big excited smile -->
  <path d="M46 69 Q60 83 74 69" stroke="#7a4020" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M50 71 Q60 80 70 71 Q70 76 60 77 Q50 76 50 71 Z" fill="white" opacity="0.85"/>
  <!-- Freckles -->
  <circle cx="52" cy="63" r="1.2" fill="#b45309" opacity="0.5"/>
  <circle cx="56" cy="65" r="1" fill="#b45309" opacity="0.4"/>
  <circle cx="68" cy="63" r="1.2" fill="#b45309" opacity="0.5"/>
  <circle cx="64" cy="65" r="1" fill="#b45309" opacity="0.4"/>
</svg>
