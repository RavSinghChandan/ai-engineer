# AstroIntel 360° — Enterprise Stack
# ─────────────────────────────────────────────────────────────────────────────
# Services:
#   zookeeper        — Kafka coordination
#   kafka            — Message broker (1 broker, 3 partitions, DLQ topic)
#   kafka-ui         — Provectus Kafka UI  → http://localhost:8090
#   redis            — L2 cache (DB 0) + job-store (DB 1) + pub/sub
#   redis-commander  — Redis browser UI    → http://localhost:8091
#   astro-api        — FastAPI backend     → http://localhost:8080
#
# Usage:
#   docker-compose up --build            # full enterprise stack
#   docker-compose up astro-api redis    # API + Redis only (no Kafka)
#
# Local dev without Docker:
#   KAFKA_ENABLED=false REDIS_ENABLED=false uvicorn main:app --reload --port 8080
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

networks:
  astrointel:
    driver: bridge

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  zookeeper_data:
    driver: local

services:

# ── Zookeeper ─────────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: astrointel-zookeeper
    networks: [astrointel]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# ── Kafka Broker ──────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: astrointel-kafka
    networks: [astrointel]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_MESSAGE_MAX_BYTES: 10485760
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

# ── Kafka UI ──────────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: astrointel-kafka-ui
    networks: [astrointel]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: astrointel
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    restart: unless-stopped

# ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: astrointel-redis
    networks: [astrointel]
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --save 300 10
      --appendonly yes
      --appendfsync everysec
      --tcp-keepalive 60
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# ── Redis Commander UI ────────────────────────────────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: astrointel-redis-ui
    networks: [astrointel]
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8091:8081"
    environment:
      REDIS_HOSTS: "cache:redis:6379:0,jobs:redis:6379:1"
    restart: unless-stopped

# ── AstroIntel API ────────────────────────────────────────────────────────────
  astro-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: astrointel-api:latest
    container_name: astrointel-api
    networks: [astrointel]
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SQLITE_DB_PATH: /data/astrointel.db
      AUTH_STORE_PATH: /data/auth_keys.json
      USERS_STORE_PATH: /data/users.json
      LEADS_STORE_PATH: /data/leads.json
      APP_ENV: development
      # Kafka enterprise settings
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP: "kafka:29092"
      KAFKA_TOPIC_ANALYSIS: "astrointel.analysis"
      KAFKA_TOPIC_DLQ: "astrointel.analysis.dlq"
      KAFKA_GROUP_ID: "astrointel-consumers"
      KAFKA_MAX_RETRIES: "3"
      KAFKA_RETRY_BACKOFF_MS: "1000"
      KAFKA_CONSUMER_WORKERS: "3"
      # Redis enterprise settings
      REDIS_ENABLED: "true"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_JOB_URL: "redis://redis:6379/1"
      REDIS_POOL_MIN: "2"
      REDIS_POOL_MAX: "20"
      REDIS_SOCKET_TIMEOUT: "3"
      REDIS_SOCKET_CONNECT_TIMEOUT: "2"
    volumes:
      - db_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
