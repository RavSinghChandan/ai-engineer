<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="120" height="150">
  <defs>
    <style>
      .av{animation:bounce .7s ease-in-out infinite alternate;}
      .s1{animation:pop 1.4s ease-in-out infinite;}
      .s2{animation:pop 1.4s .47s ease-in-out infinite;}
      .s3{animation:pop 1.4s .94s ease-in-out infinite;}
      @keyframes bounce{0%{transform:translateY(0) rotate(-1deg);}100%{transform:translateY(-6px) rotate(1deg);}}
      @keyframes pop{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.1;transform:scale(.5);}}
    </style>
  </defs>
  <text x="5"   y="30" font-size="13" class="s1" fill="#f59e0b">★</text>
  <text x="101" y="26" font-size="11" class="s2" fill="#f59e0b">✦</text>
  <text x="105" y="13" font-size="9"  class="s3" fill="#7c3aed">✦</text>
  <text x="8"   y="14" font-size="9"  class="s2" fill="#06b6d4">✦</text>
  <g class="av">
    <path d="M8 150 L8 114 Q8 101 22 96 L42 90 L60 106 L78 90 L98 96 Q112 101 112 114 L112 150 Z" fill="#2d3f5c"/>
    <path d="M42 90 L60 108 L78 90 L72 101 L60 110 L48 101 Z" fill="#a8c8e8"/>
    <path d="M42 90 L34 105 L8 114 L8 150 L44 150 L44 117 L48 101 Z" fill="#253450"/>
    <path d="M78 90 L86 105 L112 114 L112 150 L76 150 L76 117 L72 101 Z" fill="#253450"/>
    <path d="M52 90 L60 98 L68 90 L64 95 L60 99 L56 95 Z" fill="#c8dff0"/>
    <rect x="52" y="82" width="16" height="12" rx="6" fill="#c08850"/>
    <ellipse cx="60" cy="50" rx="32" ry="36" fill="#c88850"/>
    <ellipse cx="28" cy="52" rx="5" ry="8"   fill="#b07040"/>
    <ellipse cx="92" cy="52" rx="5" ry="8"   fill="#b07040"/>
    <ellipse cx="28" cy="52" rx="2.2" ry="4" fill="#8a5028" opacity="0.4"/>
    <ellipse cx="92" cy="52" rx="2.2" ry="4" fill="#8a5028" opacity="0.4"/>
    <!-- Hair -->
    <path d="M28 42 Q28 12 60 10 Q92 12 92 42 Q90 22 80 14 Q70 8 60 8 Q50 8 40 14 Q30 22 28 42 Z" fill="#18141a"/>
    <path d="M30 29 Q36 21 43 24 Q48 17 55 20 Q59 14 65 17 Q71 12 77 16 Q83 20 88 26" fill="none" stroke="#0c0a10" stroke-width="5" stroke-linecap="round"/>
    <path d="M32 22 Q39 15 46 19 Q51 12 58 15 Q63 10 69 13 Q75 10 81 14 Q87 19 90 25" fill="none" stroke="#18141a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M47 15 Q54 10 61 13 Q59 17 54 18 Q49 18 47 15 Z" fill="#18141a"/>
    <path d="M28 42 Q25 32 29 20 Q31 16 34 22 Q32 33 31 42 Z" fill="#18141a"/>
    <path d="M92 42 Q95 32 91 20 Q89 16 86 22 Q88 33 89 42 Z" fill="#18141a"/>
    <!-- Eyebrows — raised with joy -->
    <path d="M31 37 Q42 32 53 37" stroke="#0e0c12" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M67 37 Q78 32 89 37" stroke="#0e0c12" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <!-- Happy squinting eyes — joy crescents, drawn before glasses -->
    <!-- Left eye — filled crescent so it pops against skin -->
    <path d="M33 50 Q42 44 51 50 Q42 55 33 50 Z" fill="#e8c898" opacity="0.6"/>
    <path d="M33 50 Q42 44 51 50" stroke="#180c04" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M34 51 Q42 56 50 51" stroke="#180c04" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- Right eye -->
    <path d="M69 50 Q78 44 87 50 Q78 55 69 50 Z" fill="#e8c898" opacity="0.6"/>
    <path d="M69 50 Q78 44 87 50" stroke="#180c04" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M70 51 Q78 56 86 51" stroke="#180c04" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- Glasses -->
    <rect x="29" y="44" width="26" height="13" rx="3" fill="none" stroke="#a89880" stroke-width="1.9"/>
    <rect x="65" y="44" width="26" height="13" rx="3" fill="none" stroke="#a89880" stroke-width="1.9"/>
    <path d="M55 50 Q60 48 65 50" stroke="#a89880" stroke-width="1.7" fill="none"/>
    <line x1="29" y1="50" x2="22" y2="48" stroke="#a89880" stroke-width="1.7"/>
    <line x1="91" y1="50" x2="98" y2="48" stroke="#a89880" stroke-width="1.7"/>
    <!-- Cheek blush -->
    <ellipse cx="28" cy="62" rx="8" ry="4.5" fill="#e06050" opacity="0.18"/>
    <ellipse cx="92" cy="62" rx="8" ry="4.5" fill="#e06050" opacity="0.18"/>
    <!-- Nose -->
    <path d="M57 59 Q54 69 57 74 Q60 77 63 74 Q66 69 63 59" stroke="#9a5030" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <ellipse cx="56" cy="75" rx="2.8" ry="1.5" fill="#8a4020" opacity="0.35"/>
    <ellipse cx="64" cy="75" rx="2.8" ry="1.5" fill="#8a4020" opacity="0.35"/>
    <!-- Beard -->
    <path d="M32 65 Q34 63 42 63 Q50 63 60 63 Q70 63 78 63 Q86 63 88 65
             Q90 72 88 80 Q82 90 70 93 Q60 96 50 93 Q38 90 32 80 Q30 72 32 65 Z" fill="#1c1620" opacity="0.38"/>
    <path d="M34 70 Q38 68 50 68 Q60 68 70 68 Q82 68 86 70
             Q88 78 84 86 Q74 94 60 96 Q46 94 36 86 Q32 78 34 70 Z" fill="#1a1420" opacity="0.38"/>
    <path d="M48 90 Q60 97 72 90 Q68 95 60 97 Q52 95 48 90 Z" fill="#0e0c12" opacity="0.45"/>
    <!-- Moustache -->
    <path d="M47 71 Q54 77 60 75" stroke="#0e0c14" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M60 75 Q66 77 73 71" stroke="#0e0c14" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <!-- Big smile + teeth -->
    <path d="M46 81 Q60 91 74 81" stroke="#7a3820" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M48 82 Q60 90 72 82 Q72 87 60 88 Q48 87 48 82 Z" fill="white" opacity="0.85"/>
  </g>
</svg>
