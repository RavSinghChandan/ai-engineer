<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- Cartoon Chandan — happy/celebrating, arms up -->
  <!-- Body / blazer -->
  <rect x="30" y="88" width="60" height="52" rx="8" fill="#2d4a7a"/>
  <polygon points="52,88 60,103 68,88" fill="#a8c4e0"/>
  <!-- Left arm raised -->
  <rect x="15" y="68" width="22" height="12" rx="6" fill="#2d4a7a" transform="rotate(-50 26 74)"/>
  <!-- Left hand -->
  <ellipse cx="10" cy="62" rx="7" ry="7" fill="#c8956c"/>
  <!-- Right arm raised -->
  <rect x="83" y="68" width="22" height="12" rx="6" fill="#2d4a7a" transform="rotate(50 94 74)"/>
  <!-- Right hand -->
  <ellipse cx="110" cy="62" rx="7" ry="7" fill="#c8956c"/>
  <!-- Stars/sparkles celebrate -->
  <text x="5" y="50" font-size="14" fill="#f59e0b">★</text>
  <text x="100" y="48" font-size="12" fill="#f59e0b">✦</text>
  <text x="95" y="35" font-size="10" fill="#7c3aed">✨</text>
  <!-- Neck -->
  <rect x="52" y="75" width="16" height="16" rx="4" fill="#c8956c"/>
  <!-- Head -->
  <ellipse cx="60" cy="55" rx="28" ry="30" fill="#c8956c"/>
  <!-- Hair -->
  <ellipse cx="60" cy="32" rx="28" ry="16" fill="#1a1a2e"/>
  <ellipse cx="40" cy="38" rx="10" ry="8" fill="#1a1a2e"/>
  <ellipse cx="80" cy="38" rx="10" ry="8" fill="#1a1a2e"/>
  <!-- Ears -->
  <ellipse cx="32" cy="55" rx="5" ry="7" fill="#c8956c"/>
  <ellipse cx="88" cy="55" rx="5" ry="7" fill="#c8956c"/>
  <!-- Glasses -->
  <rect x="38" y="50" width="18" height="12" rx="4" fill="none" stroke="#8b7355" stroke-width="1.5"/>
  <rect x="64" y="50" width="18" height="12" rx="4" fill="none" stroke="#8b7355" stroke-width="1.5"/>
  <line x1="56" y1="56" x2="64" y2="56" stroke="#8b7355" stroke-width="1.5"/>
  <!-- Happy eyes — curved/squinting with joy -->
  <path d="M43 56 Q47 51 51 56" stroke="#2c1810" stroke-width="2" fill="none"/>
  <path d="M69 56 Q73 51 77 56" stroke="#2c1810" stroke-width="2" fill="none"/>
  <!-- Eyebrows raised -->
  <path d="M40 46 Q47 42 54 46" stroke="#1a1a2e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M66 46 Q73 42 80 46" stroke="#1a1a2e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Beard -->
  <path d="M38 65 Q60 78 82 65 Q82 72 60 78 Q38 72 38 65 Z" fill="#2c2c3e" opacity="0.7"/>
  <!-- Big happy smile -->
  <path d="M46 68 Q60 80 74 68" stroke="#8b4513" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Teeth showing -->
  <path d="M50 70 Q60 78 70 70 Q70 75 60 76 Q50 75 50 70 Z" fill="white" opacity="0.8"/>
  <!-- Nose -->
  <path d="M57 60 Q55 66 60 67 Q65 66 63 60" stroke="#b07050" stroke-width="1" fill="none"/>
</svg>