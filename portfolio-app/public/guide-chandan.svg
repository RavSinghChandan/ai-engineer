<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <style>
      .av { animation: float 3s ease-in-out infinite; }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    </style>
  </defs>

  <g class="av">

    <!-- BLAZER — dark charcoal, just shoulders showing at bottom -->
    <path d="M10 140 L10 112 Q10 100 24 96 L44 90 L60 104 L76 90 L96 96 Q110 100 110 112 L110 140 Z" fill="#232b38"/>
    <!-- Light blue shirt in centre V -->
    <path d="M44 90 L60 106 L76 90 L70 100 L60 108 L50 100 Z" fill="#93b5ce"/>
    <!-- Blazer lapels -->
    <path d="M44 90 L36 104 L10 112 L10 140 L44 140 L44 114 L50 100 Z" fill="#2c3848"/>
    <path d="M76 90 L84 104 L110 112 L110 140 L76 140 L76 114 L70 100 Z" fill="#2c3848"/>

    <!-- NECK — natural width, skin coloured -->
    <rect x="51" y="82" width="18" height="14" rx="7" fill="#b87548"/>

    <!-- HEAD — slightly tall oval, like your face shape -->
    <ellipse cx="60" cy="50" rx="34" ry="40" fill="#c07848"/>

    <!-- EARS -->
    <ellipse cx="26" cy="50" rx="6"  ry="9"  fill="#a86030"/>
    <ellipse cx="94" cy="50" rx="6"  ry="9"  fill="#a86030"/>
    <ellipse cx="26" cy="50" rx="2.8" ry="4.5" fill="#8a4818" opacity="0.45"/>
    <ellipse cx="94" cy="50" rx="2.8" ry="4.5" fill="#8a4818" opacity="0.45"/>

    <!-- HAIR — dark, wavy/curly, covers top, comes down sides naturally -->
    <!-- Main hair mass -->
    <path d="M26 40 Q26 8 60 7 Q94 8 94 40
             Q94 24 84 16 Q73 9 60 9 Q47 9 36 16 Q26 24 26 40 Z"
          fill="#141018"/>
    <!-- Wavy texture on top — natural curls -->
    <path d="M28 26 Q34 19 41 23 Q47 16 54 20 Q58 14 64 18 Q70 12 77 16 Q83 20 88 26"
          fill="none" stroke="#0a0810" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M31 20 Q38 14 45 18 Q50 12 57 15 Q62 10 68 13 Q74 10 80 14 Q86 18 90 23"
          fill="none" stroke="#141018" stroke-width="4" stroke-linecap="round"/>
    <!-- Sideburns — hair comes down the side of face naturally -->
    <path d="M26 40 Q23 28 27 18 Q29 14 32 20 Q30 30 30 40 Z" fill="#141018"/>
    <path d="M94 40 Q97 28 93 18 Q91 14 88 20 Q90 30 90 40 Z" fill="#141018"/>
    <!-- A few stray curls for natural look -->
    <path d="M34 14 Q40 9 47 13"  stroke="#0a0810" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M73 13 Q80 9 86 14"  stroke="#0a0810" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- GLASSES — thin dark frames, like yours -->
    <!-- Left lens -->
    <rect x="27" y="44" width="26" height="16" rx="4" fill="#92b0c8" fill-opacity="0.1"/>
    <rect x="27" y="44" width="26" height="16" rx="4" fill="none" stroke="#2a2010" stroke-width="2.4"/>
    <!-- Right lens -->
    <rect x="67" y="44" width="26" height="16" rx="4" fill="#92b0c8" fill-opacity="0.1"/>
    <rect x="67" y="44" width="26" height="16" rx="4" fill="none" stroke="#2a2010" stroke-width="2.4"/>
    <!-- Bridge between lenses -->
    <path d="M53 52 Q60 49 67 52" stroke="#2a2010" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- Temple arms to ears -->
    <line x1="27" y1="52" x2="20" y2="50" stroke="#2a2010" stroke-width="2.2"/>
    <line x1="93" y1="52" x2="100" y2="50" stroke="#2a2010" stroke-width="2.2"/>

    <!-- EYES — fully open, clear iris, pupil, shine -->
    <!-- Left eye -->
    <ellipse cx="40" cy="52" rx="8"   ry="7"  fill="white"/>
    <circle  cx="40" cy="52" r="5.2"  fill="#2e1206"/>
    <circle  cx="40" cy="52" r="2.9"  fill="#080300"/>
    <circle  cx="42.5" cy="49.5" r="1.9" fill="white"/>
    <circle  cx="39"   cy="54.5" r="0.8" fill="white" opacity="0.5"/>
    <!-- Left upper eyelid crease -->
    <path d="M32 47 Q40 43 48 47" stroke="#180804" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Right eye -->
    <ellipse cx="80" cy="52" rx="8"   ry="7"  fill="white"/>
    <circle  cx="80" cy="52" r="5.2"  fill="#2e1206"/>
    <circle  cx="80" cy="52" r="2.9"  fill="#080300"/>
    <circle  cx="82.5" cy="49.5" r="1.9" fill="white"/>
    <circle  cx="79"   cy="54.5" r="0.8" fill="white" opacity="0.5"/>
    <path d="M72 47 Q80 43 88 47" stroke="#180804" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- EYEBROWS — dark, natural, not too thick, above glasses -->
    <path d="M29 41 Q40 36 51 41" stroke="#0c0810" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M69 41 Q80 36 91 41" stroke="#0c0810" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- NOSE — bridge + tip, nostrils subtly shown -->
    <path d="M57 60 Q54 70 57 74 Q60 77 63 74 Q66 70 63 60"
          stroke="#7a3810" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <ellipse cx="57" cy="74" rx="3"   ry="1.8" fill="#7a3810" opacity="0.4"/>
    <ellipse cx="63" cy="74" rx="3"   ry="1.8" fill="#7a3810" opacity="0.4"/>

    <!-- BEARD — NATURAL, just outlines the jawline and chin area.
         Does NOT cover the mouth. Think 5-day stubble grown out naturally.
         It's a subtle shadow/texture along the jaw, not a blob. -->

    <!-- Light stubble shadow on cheeks only — just a wash of colour -->
    <path d="M28 68 Q32 80 40 85 Q50 90 60 90 Q70 90 80 85 Q88 80 92 68"
          fill="#1a1428" opacity="0.18"/>

    <!-- Jaw line beard — thin strip along the lower jaw, NOT covering face -->
    <!-- Left jaw -->
    <path d="M28 68 Q30 78 36 84 Q43 90 50 91" stroke="#1a1428" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- Right jaw -->
    <path d="M92 68 Q90 78 84 84 Q77 90 70 91" stroke="#1a1428" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- Chin beard — just the chin, thin -->
    <path d="M50 91 Q60 94 70 91" stroke="#1a1428" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.75"/>

    <!-- MOUSTACHE — two arcs above the lips, natural, not covering mouth -->
    <path d="M47 72 Q54 77 60 75" stroke="#0e0c18" stroke-width="3"   fill="none" stroke-linecap="round"/>
    <path d="M60 75 Q66 77 73 72" stroke="#0e0c18" stroke-width="3"   fill="none" stroke-linecap="round"/>

    <!-- LIPS / MOUTH — clearly visible, natural -->
    <!-- Upper lip line -->
    <path d="M50 78 Q55 76 60 77 Q65 76 70 78" stroke="#7a3010" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Confident slight smile -->
    <path d="M49 81 Q60 87 71 81" stroke="#7a3010" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  </g>
</svg>
