<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100" height="110">
  <defs>
    <style>
      .face { animation: float 3s ease-in-out infinite; transform-origin: 50px 55px; }
      .lid-l { animation: blink 4.5s ease-in-out infinite; transform-origin: 34px 49px; }
      .lid-r { animation: blink 4.5s ease-in-out infinite; transform-origin: 66px 49px; }
      @keyframes float {
        0%,100% { transform: translateY(0); }
        50%      { transform: translateY(-3px); }
      }
      @keyframes blink {
        0%,91%,100% { transform: scaleY(1); }
        94%          { transform: scaleY(0.06); }
      }
    </style>
    <radialGradient id="sk" cx="46%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#d4895a"/>
      <stop offset="100%" stop-color="#a85c28"/>
    </radialGradient>
    <radialGradient id="sk2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4895a"/>
      <stop offset="100%" stop-color="#a85c28"/>
    </radialGradient>
    <linearGradient id="hr" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c2a"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d4fa0"/>
      <stop offset="100%" stop-color="#172860"/>
    </linearGradient>
  </defs>

  <g class="face">
    <!-- Shoulders / suit top -->
    <path d="M8 110 Q8 86 25 81 L42 77 L50 87 L58 77 L75 81 Q92 86 92 110 Z" fill="url(#suit)"/>
    <path d="M42 77 L50 88 L58 77" fill="none" stroke="#9ab8e8" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Neck -->
    <rect x="43" y="69" width="14" height="13" rx="5" fill="url(#sk)"/>

    <!-- Head -->
    <ellipse cx="50" cy="43" rx="33" ry="36" fill="url(#sk)"/>

    <!-- Ears -->
    <ellipse cx="17" cy="43" rx="6.5" ry="9.5" fill="url(#sk2)"/>
    <ellipse cx="83" cy="43" rx="6.5" ry="9.5" fill="url(#sk2)"/>
    <ellipse cx="17" cy="43" rx="3.2" ry="5.5" fill="#8a4520" opacity="0.35"/>
    <ellipse cx="83" cy="43" rx="3.2" ry="5.5" fill="#8a4520" opacity="0.35"/>

    <!-- Hair — clean dark top, side swept -->
    <path d="M17 34 Q17 7 50 6 Q83 7 83 34
             Q83 22 75 15 Q63 8 50 8 Q37 8 25 15 Q17 22 17 34 Z"
          fill="url(#hr)"/>
    <path d="M17 34 Q15 23 19 17 Q21 14 23 20 Q21 27 21 34 Z" fill="url(#hr)"/>
    <path d="M83 34 Q85 23 81 17 Q79 14 77 20 Q79 27 79 34 Z" fill="url(#hr)"/>

    <!-- Glasses — two clean rectangular frames -->
    <rect x="21" y="38" width="25" height="18" rx="5" fill="white" fill-opacity="0.06"/>
    <rect x="21" y="38" width="25" height="18" rx="5" fill="none" stroke="#9a7030" stroke-width="2.2"/>
    <rect x="54" y="38" width="25" height="18" rx="5" fill="white" fill-opacity="0.06"/>
    <rect x="54" y="38" width="25" height="18" rx="5" fill="none" stroke="#9a7030" stroke-width="2.2"/>
    <!-- Bridge -->
    <path d="M46 47 Q50 44.5 54 47" stroke="#9a7030" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Temples -->
    <line x1="21" y1="47" x2="15" y2="45" stroke="#9a7030" stroke-width="2"/>
    <line x1="79" y1="47" x2="85" y2="45" stroke="#9a7030" stroke-width="2"/>

    <!-- Eyes — open, alert -->
    <!-- Left eye -->
    <ellipse cx="33.5" cy="47" rx="7.5" ry="7" fill="white"/>
    <circle  cx="33.5" cy="47" r="5"   fill="#2a1208"/>
    <circle  cx="33.5" cy="47" r="2.8" fill="#0c0404"/>
    <circle  cx="35.5" cy="44.8" r="1.6" fill="white" opacity="0.95"/>
    <!-- Left eyelid (blink) -->
    <g class="lid-l">
      <ellipse cx="33.5" cy="47" rx="7.5" ry="7" fill="url(#sk)"/>
    </g>
    <!-- Left upper eyelash line -->
    <path d="M26 43 Q33.5 40 41 43" stroke="#1a0a04" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Right eye -->
    <ellipse cx="66.5" cy="47" rx="7.5" ry="7" fill="white"/>
    <circle  cx="66.5" cy="47" r="5"   fill="#2a1208"/>
    <circle  cx="66.5" cy="47" r="2.8" fill="#0c0404"/>
    <circle  cx="68.5" cy="44.8" r="1.6" fill="white" opacity="0.95"/>
    <!-- Right eyelid (blink) -->
    <g class="lid-r">
      <ellipse cx="66.5" cy="47" rx="7.5" ry="7" fill="url(#sk)"/>
    </g>
    <!-- Right upper eyelash line -->
    <path d="M59 43 Q66.5 40 74 43" stroke="#1a0a04" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Eyebrows — thick, confident, horizontal -->
    <path d="M23 36 Q33.5 32 44 36"  stroke="#100808" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M56 36 Q66.5 32 77 36"  stroke="#100808" stroke-width="3.2" fill="none" stroke-linecap="round"/>

    <!-- Nose — clear bridge and tip -->
    <path d="M47 53 Q44 61 47 64 Q50 66.5 53 64 Q56 61 53 53"
          stroke="#8a4020" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="47" cy="64" rx="2.5" ry="1.5" fill="#8a4020" opacity="0.5"/>
    <ellipse cx="53" cy="64" rx="2.5" ry="1.5" fill="#8a4020" opacity="0.5"/>

    <!-- Beard — clean dark fill covering lower face -->
    <path d="M19 61 Q19 79 50 82 Q81 79 81 61
             Q79 71 65 75 Q57 78 50 78 Q43 78 35 75 Q21 71 19 61 Z"
          fill="#141420" opacity="0.85"/>
    <!-- Beard top fade into skin -->
    <path d="M19 61 Q21 57 50 56 Q79 57 81 61" fill="none" stroke="#141420" stroke-width="0.8" opacity="0.4"/>

    <!-- Moustache — two neat curves -->
    <path d="M38 66 Q44 71 50 69" stroke="#0e0e1c" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M50 69 Q56 71 62 66" stroke="#0e0e1c" stroke-width="2.8" fill="none" stroke-linecap="round"/>

    <!-- Mouth — calm confident line, slight upturn -->
    <path d="M41 73 Q50 77 59 73" stroke="#6a2808" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
