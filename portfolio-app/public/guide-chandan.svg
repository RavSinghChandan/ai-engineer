<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100" height="110">
  <defs>
    <style>
      .face { animation: float 3s ease-in-out infinite; transform-origin: 50px 55px; }
      .eyelid-l { animation: blink 4s ease-in-out infinite; transform-origin: 35px 50px; }
      .eyelid-r { animation: blink 4s ease-in-out infinite; transform-origin: 65px 50px; }
      @keyframes float {
        0%,100% { transform: translateY(0); }
        50%      { transform: translateY(-3px); }
      }
      @keyframes blink {
        0%,90%,100% { transform: scaleY(1); }
        95%          { transform: scaleY(0.05); }
      }
    </style>
    <radialGradient id="sk" cx="48%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#f0b97c"/>
      <stop offset="100%" stop-color="#cc7e3a"/>
    </radialGradient>
    <radialGradient id="sk2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0b97c"/>
      <stop offset="100%" stop-color="#cc7e3a"/>
    </radialGradient>
    <linearGradient id="hr" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e2e42"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#304e9a"/>
      <stop offset="100%" stop-color="#1a2d60"/>
    </linearGradient>
  </defs>

  <g class="face">

    <!-- Shoulders / top of suit — just a hint at bottom -->
    <path d="M10 110 Q10 88 26 83 L42 79 L50 88 L58 79 L74 83 Q90 88 90 110 Z" fill="url(#suit)"/>
    <!-- Shirt collar V -->
    <path d="M42 79 L50 90 L58 79" fill="none" stroke="#a8c4f0" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Neck -->
    <rect x="43" y="71" width="14" height="13" rx="5" fill="url(#sk)"/>

    <!-- Head — large, takes up most canvas -->
    <ellipse cx="50" cy="44" rx="34" ry="37" fill="url(#sk)"/>

    <!-- Ears — properly sized -->
    <ellipse cx="16" cy="44" rx="6" ry="9" fill="url(#sk2)"/>
    <ellipse cx="84" cy="44" rx="6" ry="9" fill="url(#sk2)"/>
    <!-- Inner ear detail -->
    <ellipse cx="16" cy="44" rx="3" ry="5" fill="#c07035" opacity="0.4"/>
    <ellipse cx="84" cy="44" rx="3" ry="5" fill="#c07035" opacity="0.4"/>

    <!-- Hair — styled, covers top of head cleanly -->
    <path d="M16 36 Q16 8 50 7 Q84 8 84 36
             Q84 24 76 17 Q64 10 50 10 Q36 10 24 17 Q16 24 16 36 Z"
          fill="url(#hr)"/>
    <!-- Hair side tuft left -->
    <path d="M16 36 Q14 26 18 20 Q20 17 22 22 Q20 28 20 36 Z" fill="url(#hr)"/>
    <!-- Hair side tuft right -->
    <path d="M84 36 Q86 26 82 20 Q80 17 78 22 Q80 28 80 36 Z" fill="url(#hr)"/>

    <!-- ── GLASSES ── -->
    <!-- Left lens frame -->
    <rect x="22" y="40" width="24" height="17" rx="5.5" fill="white" fill-opacity="0.07"/>
    <rect x="22" y="40" width="24" height="17" rx="5.5" fill="none" stroke="#a07840" stroke-width="2"/>
    <!-- Right lens frame -->
    <rect x="54" y="40" width="24" height="17" rx="5.5" fill="white" fill-opacity="0.07"/>
    <rect x="54" y="40" width="24" height="17" rx="5.5" fill="none" stroke="#a07840" stroke-width="2"/>
    <!-- Bridge -->
    <path d="M46 48.5 Q50 46 54 48.5" stroke="#a07840" stroke-width="2" fill="none"/>
    <!-- Temple arms -->
    <line x1="22" y1="48" x2="16" y2="46" stroke="#a07840" stroke-width="2"/>
    <line x1="78" y1="48" x2="84" y2="46" stroke="#a07840" stroke-width="2"/>

    <!-- ── EYES ── -->
    <!-- Left eye white -->
    <ellipse cx="34" cy="49" rx="7" ry="6" fill="white"/>
    <!-- Left iris -->
    <circle cx="34" cy="49" r="4.5" fill="#3d2010"/>
    <!-- Left pupil -->
    <circle cx="34" cy="49" r="2.5" fill="#0a0505"/>
    <!-- Left eye shine -->
    <circle cx="36" cy="47" r="1.4" fill="white" opacity="0.95"/>

    <!-- Right eye white -->
    <ellipse cx="66" cy="49" rx="7" ry="6" fill="white"/>
    <!-- Right iris -->
    <circle cx="66" cy="49" r="4.5" fill="#3d2010"/>
    <!-- Right pupil -->
    <circle cx="66" cy="49" r="2.5" fill="#0a0505"/>
    <!-- Right eye shine -->
    <circle cx="68" cy="47" r="1.4" fill="white" opacity="0.95"/>

    <!-- Blink overlay (animated) -->
    <g class="eyelid-l">
      <ellipse cx="34" cy="49" rx="7" ry="6" fill="url(#sk)"/>
    </g>
    <g class="eyelid-r">
      <ellipse cx="66" cy="49" rx="7" ry="6" fill="url(#sk)"/>
    </g>

    <!-- ── EYEBROWS ── -->
    <path d="M23 37 Q34 33 45 37" stroke="#1a1020" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M55 37 Q66 33 77 37" stroke="#1a1020" stroke-width="2.8" fill="none" stroke-linecap="round"/>

    <!-- ── NOSE ── -->
    <path d="M47 54 Q44 62 47 65 Q50 67 53 65 Q56 62 53 54"
          stroke="#b87040" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Nostrils -->
    <ellipse cx="47" cy="65" rx="2.2" ry="1.4" fill="#b87040" opacity="0.5"/>
    <ellipse cx="53" cy="65" rx="2.2" ry="1.4" fill="#b87040" opacity="0.5"/>

    <!-- ── BEARD ── -->
    <!-- Full beard shape -->
    <path d="M18 62 Q18 80 50 83 Q82 80 82 62
             Q80 72 66 76 Q58 79 50 79 Q42 79 34 76 Q20 72 18 62 Z"
          fill="#1e1e2e" opacity="0.82"/>
    <!-- Beard fade top edge — softens into skin -->
    <path d="M18 62 Q20 58 50 57 Q80 58 82 62" fill="none" stroke="#1e1e2e" stroke-width="1" opacity="0.4"/>

    <!-- Moustache -->
    <path d="M38 67 Q44 72 50 70 Q56 72 62 67"
          stroke="#111" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- ── SMILE — confident, neutral ── -->
    <path d="M40 74 Q50 79 60 74"
          stroke="#7a3010" stroke-width="2" fill="none" stroke-linecap="round"/>

  </g>
</svg>
