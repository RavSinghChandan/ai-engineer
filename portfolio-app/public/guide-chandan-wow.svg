<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100" height="110">
  <defs>
    <style>
      .face-w { animation: wowPulse 0.55s ease-in-out infinite; transform-origin: 50px 55px; }
      .imp1   { animation: spin 1.8s linear infinite; transform-origin: 8px 36px; }
      .imp2   { animation: spin 2.3s linear infinite reverse; transform-origin: 92px 32px; }
      .imp3   { animation: pop 1.1s ease-in-out infinite; }
      .imp4   { animation: pop 1.1s ease-in-out 0.55s infinite; }
      @keyframes wowPulse {
        0%,100% { transform: scale(1) rotate(0deg); }
        25%     { transform: scale(1.04) rotate(-1.5deg); }
        75%     { transform: scale(1.04) rotate(1.5deg); }
      }
      @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
      @keyframes pop  { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.2;transform:scale(0.55);} }
    </style>
    <radialGradient id="sk" cx="46%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#d4895a"/>
      <stop offset="100%" stop-color="#a85c28"/>
    </radialGradient>
    <radialGradient id="sk2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4895a"/>
      <stop offset="100%" stop-color="#a85c28"/>
    </radialGradient>
    <linearGradient id="hr" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c2a"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d4fa0"/>
      <stop offset="100%" stop-color="#172860"/>
    </linearGradient>
  </defs>

  <text x="2"  y="38" font-size="13" class="imp1" fill="#f59e0b">✦</text>
  <text x="88" y="34" font-size="11" class="imp2" fill="#06b6d4">★</text>
  <text x="4"  y="18" font-size="9"  class="imp3" fill="#7c3aed">⚡</text>
  <text x="87" y="16" font-size="9"  class="imp4" fill="#10b981">⚡</text>

  <g class="face-w">
    <path d="M8 110 Q8 86 25 81 L42 77 L50 87 L58 77 L75 81 Q92 86 92 110 Z" fill="url(#suit)"/>
    <path d="M42 77 L50 88 L58 77" fill="none" stroke="#9ab8e8" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="43" y="69" width="14" height="13" rx="5" fill="url(#sk)"/>
    <ellipse cx="50" cy="43" rx="33" ry="36" fill="url(#sk)"/>
    <ellipse cx="17" cy="43" rx="6.5" ry="9.5" fill="url(#sk2)"/>
    <ellipse cx="83" cy="43" rx="6.5" ry="9.5" fill="url(#sk2)"/>
    <ellipse cx="17" cy="43" rx="3.2" ry="5.5" fill="#8a4520" opacity="0.35"/>
    <ellipse cx="83" cy="43" rx="3.2" ry="5.5" fill="#8a4520" opacity="0.35"/>
    <path d="M17 34 Q17 7 50 6 Q83 7 83 34 Q83 22 75 15 Q63 8 50 8 Q37 8 25 15 Q17 22 17 34 Z" fill="url(#hr)"/>
    <path d="M17 34 Q15 23 19 17 Q21 14 23 20 Q21 27 21 34 Z" fill="url(#hr)"/>
    <path d="M83 34 Q85 23 81 17 Q79 14 77 20 Q79 27 79 34 Z" fill="url(#hr)"/>

    <!-- Glasses -->
    <rect x="21" y="36" width="25" height="19" rx="5" fill="white" fill-opacity="0.06"/>
    <rect x="21" y="36" width="25" height="19" rx="5" fill="none" stroke="#9a7030" stroke-width="2.2"/>
    <rect x="54" y="36" width="25" height="19" rx="5" fill="white" fill-opacity="0.06"/>
    <rect x="54" y="36" width="25" height="19" rx="5" fill="none" stroke="#9a7030" stroke-width="2.2"/>
    <path d="M46 45.5 Q50 43 54 45.5" stroke="#9a7030" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="21" y1="45" x2="15" y2="43" stroke="#9a7030" stroke-width="2"/>
    <line x1="79" y1="45" x2="85" y2="43" stroke="#9a7030" stroke-width="2"/>

    <!-- Wide amazed eyes — big whites -->
    <ellipse cx="33.5" cy="46" rx="8.5" ry="8" fill="white"/>
    <circle  cx="33.5" cy="46" r="5.8" fill="#2a1208"/>
    <circle  cx="33.5" cy="46" r="3.2" fill="#0c0404"/>
    <circle  cx="35.5" cy="43.5" r="1.8" fill="white" opacity="0.95"/>
    <ellipse cx="66.5" cy="46" rx="8.5" ry="8" fill="white"/>
    <circle  cx="66.5" cy="46" r="5.8" fill="#2a1208"/>
    <circle  cx="66.5" cy="46" r="3.2" fill="#0c0404"/>
    <circle  cx="68.5" cy="43.5" r="1.8" fill="white" opacity="0.95"/>
    <path d="M25 42 Q33.5 39 42 42" stroke="#1a0a04" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M58 42 Q66.5 39 75 42" stroke="#1a0a04" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Eyebrows shot up -->
    <path d="M22 30 Q33.5 25 45 30" stroke="#100808" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M55 30 Q66.5 25 78 30" stroke="#100808" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M47 53 Q44 61 47 64 Q50 66.5 53 64 Q56 61 53 53" stroke="#8a4020" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <ellipse cx="47" cy="64" rx="2.5" ry="1.5" fill="#8a4020" opacity="0.5"/>
    <ellipse cx="53" cy="64" rx="2.5" ry="1.5" fill="#8a4020" opacity="0.5"/>

    <!-- Beard -->
    <path d="M19 61 Q19 79 50 82 Q81 79 81 61 Q79 71 65 75 Q57 78 50 78 Q43 78 35 75 Q21 71 19 61 Z" fill="#141420" opacity="0.85"/>
    <path d="M38 66 Q44 71 50 69" stroke="#0e0e1c" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M50 69 Q56 71 62 66" stroke="#0e0e1c" stroke-width="2.8" fill="none" stroke-linecap="round"/>

    <!-- Open wow mouth -->
    <ellipse cx="50" cy="75" rx="8"   ry="6"   fill="#6a2808"/>
    <ellipse cx="50" cy="73" rx="6.5" ry="2.8" fill="white" opacity="0.82"/>
  </g>
</svg>
