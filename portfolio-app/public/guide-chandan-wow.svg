<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <style>
      .av{animation:wowS .5s ease-in-out infinite;}
      .i1{animation:spin 1.8s linear infinite;transform-origin:10px 42px;}
      .i2{animation:spin 2.3s linear infinite reverse;transform-origin:110px 38px;}
      .i3{animation:pop 1.1s ease-in-out infinite;}
      .i4{animation:pop 1.1s .55s ease-in-out infinite;}
      @keyframes wowS{0%,100%{transform:scale(1) rotate(0);}25%{transform:scale(1.05) rotate(-2deg);}75%{transform:scale(1.05) rotate(2deg);}}
      @keyframes spin{0%{transform:rotate(0);}100%{transform:rotate(360deg);}}
      @keyframes pop{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.15;transform:scale(.5);}}
    </style>
  </defs>
  <text x="3"   y="46" font-size="15" class="i1" fill="#f59e0b">✦</text>
