<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- Cartoon Chandan — thinking/reading, hand on chin -->
  <!-- Body / blazer -->
  <rect x="30" y="88" width="60" height="52" rx="8" fill="#2d4a7a"/>
  <polygon points="52,88 60,103 68,88" fill="#a8c4e0"/>
  <!-- Left arm at side -->
  <rect x="18" y="90" width="20" height="12" rx="6" fill="#2d4a7a"/>
  <!-- Right arm bent, hand at chin -->
  <rect x="72" y="82" width="30" height="12" rx="6" fill="#2d4a7a" transform="rotate(-30 87 88)"/>
  <!-- Hand at chin -->
  <ellipse cx="72" cy="78" rx="7" ry="6" fill="#c8956c"/>
  <!-- Thought bubbles -->
  <circle cx="95" cy="45" r="10" fill="white" opacity="0.9" stroke="#e4e4e7" stroke-width="1"/>
  <circle cx="108" cy="30" r="7" fill="white" opacity="0.8" stroke="#e4e4e7" stroke-width="1"/>
  <circle cx="90" cy="62" r="4" fill="white" opacity="0.7" stroke="#e4e4e7" stroke-width="1"/>
  <text x="86" y="49" font-size="9" fill="#7c3aed">🔮</text>
  <!-- Neck -->
  <rect x="52" y="75" width="16" height="16" rx="4" fill="#c8956c"/>
  <!-- Head slightly tilted -->
  <ellipse cx="60" cy="55" rx="28" ry="30" fill="#c8956c"/>
  <!-- Hair -->
  <ellipse cx="60" cy="32" rx="28" ry="16" fill="#1a1a2e"/>
  <ellipse cx="40" cy="38" rx="10" ry="8" fill="#1a1a2e"/>
  <ellipse cx="80" cy="38" rx="10" ry="8" fill="#1a1a2e"/>
  <!-- Ears -->
  <ellipse cx="32" cy="55" rx="5" ry="7" fill="#c8956c"/>
  <ellipse cx="88" cy="55" rx="5" ry="7" fill="#c8956c"/>
  <!-- Glasses -->
  <rect x="38" y="50" width="18" height="12" rx="4" fill="none" stroke="#8b7355" stroke-width="1.5"/>
  <rect x="64" y="50" width="18" height="12" rx="4" fill="none" stroke="#8b7355" stroke-width="1.5"/>
  <line x1="56" y1="56" x2="64" y2="56" stroke="#8b7355" stroke-width="1.5"/>
  <!-- Thinking eyes — one slightly squinted -->
  <circle cx="47" cy="56" r="3.5" fill="#2c1810"/>
  <circle cx="48.5" cy="55" r="1" fill="white"/>
  <circle cx="73" cy="56" r="3" fill="#2c1810"/>
  <circle cx="74" cy="55" r="0.8" fill="white"/>
  <!-- One eyebrow up thinking -->
  <path d="M40 48 Q47 45 54 48" stroke="#1a1a2e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M66 46 Q73 43 80 47" stroke="#1a1a2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Beard -->
  <path d="M38 65 Q60 78 82 65 Q82 72 60 78 Q38 72 38 65 Z" fill="#2c2c3e" opacity="0.7"/>
  <!-- Thoughtful expression -->
  <path d="M50 70 Q60 72 70 70" stroke="#8b4513" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M57 60 Q55 66 60 67 Q65 66 63 60" stroke="#b07050" stroke-width="1" fill="none"/>
</svg>