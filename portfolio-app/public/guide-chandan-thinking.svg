<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="120" height="150">
  <defs>
    <style>
      .av{animation:tilt 3.5s ease-in-out infinite;}
      .b1{animation:bf 2s ease-in-out infinite;}
      .b2{animation:bf 2s .6s ease-in-out infinite;}
      .b3{animation:bf 2s 1.2s ease-in-out infinite;}
      @keyframes tilt{0%,100%{transform:rotate(0deg) translateY(0);}35%{transform:rotate(-2.5deg) translateY(-3px);}70%{transform:rotate(1deg) translateY(-1px);}}
      @keyframes bf{0%,100%{opacity:.9;transform:translateY(0);}50%{opacity:.25;transform:translateY(-7px);}}
    </style>
  </defs>
  <circle cx="102" cy="66" r="5"  fill="white" opacity="0.88" stroke="#9ca3af" stroke-width="1"   class="b1"/>
  <circle cx="110" cy="46" r="9"  fill="white" opacity="0.9"  stroke="#9ca3af" stroke-width="1.2" class="b2"/>
  <circle cx="114" cy="24" r="13" fill="white" opacity="0.92" stroke="#9ca3af" stroke-width="1.5" class="b3"/>
  <text x="108" y="28" font-size="10" fill="#7c3aed" text-anchor="middle" class="b3">AI</text>
  <g class="av">
    <path d="M8 150 L8 114 Q8 101 22 96 L42 90 L60 106 L78 90 L98 96 Q112 101 112 114 L112 150 Z" fill="#2d3f5c"/>
    <path d="M42 90 L60 108 L78 90 L72 101 L60 110 L48 101 Z" fill="#a8c8e8"/>
