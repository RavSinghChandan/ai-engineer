<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <title>3D Neural Scene — Portfolio Preview</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#09090b;color:#fafafa;font-family:'Inter',system-ui,sans-serif;overflow:hidden}
    #canvas-wrap{position:fixed;inset:0}
    canvas{display:block;width:100%;height:100%}
    .label{position:fixed;top:2rem;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:10}
    .label h1{font-size:clamp(1.4rem,3vw,2.2rem);font-weight:900;letter-spacing:-0.04em;
      background:linear-gradient(135deg,#a78bfa,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .label p{font-size:0.78rem;color:#71717a;margin-top:0.4rem;letter-spacing:0.04em}
    .hint{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);
      font-size:0.72rem;color:#52525b;letter-spacing:0.06em;pointer-events:none}
  </style>
</head>
<body>
  <div id="canvas-wrap"><canvas id="c"></canvas></div>
  <div class="label">
    <h1>Chandan Kumar</h1>
    <p>SENIOR AI ENGINEER · NEURAL INTELLIGENCE</p>
  </div>
  <p class="hint">DRAG TO ORBIT · PROTOTYPE</p>
  <script type="module">
    import * as THREE from '/node_modules/three/build/three.module.js';
  </script>
</body>
</html>
